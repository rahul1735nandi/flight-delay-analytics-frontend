<div class="reports-container">
  <div class="reports-header">
    <div>
      <h1>Airport Delay Reports</h1>
      <p>Flight delay analytics across major airports</p>
    </div>
  </div>

  <mat-card class="table-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Airport</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input
         matInput
         placeholder="e.g. JFK"
         (keyup)="applyFilter($event)"
         >
      </mat-form-field>
    </div>

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="reports-table">

      <ng-container matColumnDef="origin">
        <th mat-header-cell *matHeaderCellDef>
          Airport
        </th>

        <td mat-cell *matCellDef="let element">
          <span class="origin-badge">
            {{element.origin}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="Total_Flights">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Total Flights
        </th>

        <td mat-cell *matCellDef="let element">
          <span class="total-flights">
            {{ element.Total_Flights | number }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="Delayed_Flights">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Delayed Flights
        </th>

        <td mat-cell *matCellDef="let element">
          <span class="delayed-flights">
            {{ element.Delayed_Flights | number }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="Delay_Rate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Delay Ratestatus-badge
        </th>

        <td mat-cell *matCellDef="let element">
          <span class="delay-rate-badge">
            {{ element.Delay_Rate | number:'1.2-2' }}%
          </span>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>
    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5,10,20,25,50]"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card>
</div>
