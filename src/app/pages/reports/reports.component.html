<div class="reports-container">

  <div class="reports-header">

    <div>
      <h1>Airport Delay Reports</h1>
      <p>Flight delay analytics across major airports</p>
    </div>

    <!-- <button mat-raised-button color="primary">
      Export Report
    </button> -->

  </div>

  <mat-card class="table-card">

    <table
      mat-table
      [dataSource]="dataSource"
      class="reports-table">

      <!-- Airport Column -->
      <ng-container matColumnDef="airport">
        <th mat-header-cell *matHeaderCellDef>
          Airport
        </th>

        <td mat-cell *matCellDef="let element">
          {{element.airport}}
        </td>
      </ng-container>

      <!-- Delay Column -->
      <ng-container matColumnDef="delay">
        <th mat-header-cell *matHeaderCellDef>
          Delay %
        </th>

        <td mat-cell *matCellDef="let element">
          <span class="delay-badge">
            {{element.delay}}
          </span>
        </td>
      </ng-container>

      <!-- Flights Column -->
      <ng-container matColumnDef="flights">
        <th mat-header-cell *matHeaderCellDef>
          Total Flights
        </th>

        <td mat-cell *matCellDef="let element">
          {{element.flights}}
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>

        <td mat-cell *matCellDef="let element">

          <span
            class="status"
            [ngClass]="{
              'high-delay': element.status === 'High',
              'medium-delay': element.status === 'Medium',
              'low-delay': element.status === 'Low'
            }">

            {{element.status}}

          </span>

        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>

    </table>

  </mat-card>

</div>
